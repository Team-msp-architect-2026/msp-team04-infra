apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-service-prod-secret
  namespace: moment-prod
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/part-of: moment
    app.kubernetes.io/managed-by: argocd
    environment: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: moment-prod-aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: moment-prod-ai-service-secret
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: openai-api-key
      remoteRef:
        key: moment/prod/ai-service
        property: openai-api-key
