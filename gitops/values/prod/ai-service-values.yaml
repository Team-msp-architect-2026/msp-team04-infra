namespace: moment-prod

replicaCount: 2

image:
  repository: 611058323802.dkr.ecr.ap-northeast-3.amazonaws.com/moment-prod-ai-service
  tag: prod-62e003b
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: moment-prod-ai-service-sa
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::611058323802:role/moment-prod-ai-service-irsa-role"

config:
  ENVIRONMENT: prod
  AWS_REGION: ap-northeast-3
  LOG_LEVEL: INFO
  OPENAI_MODEL: gpt-4o-mini
  OPENAI_EMBEDDING_MODEL: text-embedding-3-small
  OPENAI_TIMEOUT_SECONDS: "15"
  OPENSEARCH_HOST: vpc-moment-prod-opensearch-2trht5bolkacngjunc6lsbibuq.ap-northeast-3.es.amazonaws.com
  BACKEND_API_URL: "http://backend-api:8080"

secretRefs:
  - envName: OPENAI_API_KEY
    secretName: moment-prod-ai-service-secret
    secretKey: openai-api-key

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6
  successThreshold: 1

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 40
  periodSeconds: 15
  timeoutSeconds: 2
  failureThreshold: 5
  successThreshold: 1

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

# HA: RollingUpdate - Spot 노드 중단 고려, maxUnavailable 0
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# HA: PDB - prod replica 2, Spot이라 중단 보호 필요
pdb:
  enabled: true
  minAvailable: 1

nodeSelector:
  workload: ai
  capacity: spot

tolerations:
  - key: workload
    operator: Equal
    value: ai
    effect: NoSchedule
  - key: capacity
    operator: Equal
    value: spot
    effect: NoSchedule

affinity: {}
