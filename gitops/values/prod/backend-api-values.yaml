namespace: moment-prod

replicaCount: 2

image:
  repository: 611058323802.dkr.ecr.ap-northeast-3.amazonaws.com/moment-prod-backend-api
  tag: prod-24eabd0
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: moment-prod-backend-api-sa
  annotations: {}
  # TODO: prod backend-api 전용 IRSA Role 생성 후 아래 형태로 변경
  # annotations:
  #   eks.amazonaws.com/role-arn: "arn:aws:iam::611058323802:role/moment-prod-backend-api-irsa-role"

config:
  SPRING_PROFILES_ACTIVE: prod
  AWS_REGION: ap-northeast-3
  ENVIRONMENT: prod


  DB_HOST: moment-prod-postgres.c3qggqseuzcb.ap-northeast-3.rds.amazonaws.com
  DB_PORT: "5432"
  DB_NAME: moment
  DB_URL: "jdbc:postgresql://moment-prod-postgres.c3qggqseuzcb.ap-northeast-3.rds.amazonaws.com:5432/moment"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://moment-prod-postgres.c3qggqseuzcb.ap-northeast-3.rds.amazonaws.com:5432/moment"
  SPRING_FLYWAY_URL: "jdbc:postgresql://moment-prod-postgres.c3qggqseuzcb.ap-northeast-3.rds.amazonaws.com:5432/moment"

  REDIS_HOST: moment-prod-redis.o0zxzf.ng.0001.apn3.cache.amazonaws.com
  REDIS_PORT: "6379"

  OPENSEARCH_PORT: "443"
  OPENSEARCH_SCHEME: https
  OPENSEARCH_HOST: vpc-moment-prod-opensearch-2trht5bolkacngjunc6lsbibuq.ap-northeast-3.es.amazonaws.com

  PROFILE_IMAGE_BUCKET_NAME: moment-prod-profile-image-611058323802-ap-northeast-3
  PROFILE_IMAGE_PUBLIC_URL_BASE: https://moment-prod-profile-image-611058323802-ap-northeast-3.s3.ap-northeast-3.amazonaws.com
  PROFILE_IMAGE_PRESIGNED_URL_EXPIRATION_SECONDS: "600"
  PROFILE_IMAGE_MAX_FILE_SIZE_BYTES: "5242880"
  PROFILE_IMAGE_KEY_PREFIX: uploads/profile
  SQS_QUEUE_NAME: moment-prod-public-data-queue
  SQS_QUEUE_URL: https://sqs.ap-northeast-3.amazonaws.com/611058323802/moment-prod-public-data-queue
  AI_SERVICE_BASE_URL: "http://ai-service:8000"
  NOTIFICATION_SNS_ENABLED: "false"
  NOTIFICATION_SNS_TOPIC_ARN: ""

secretRefs:
  - envName: DB_USERNAME
    secretName: moment-prod-backend-api-secret
    secretKey: db-username

  - envName: DB_PASSWORD
    secretName: moment-prod-backend-api-secret
    secretKey: db-password
  - envName: SPRING_DATASOURCE_USERNAME
    secretName: moment-prod-backend-api-secret
    secretKey: db-username
  - envName: SPRING_DATASOURCE_PASSWORD
    secretName: moment-prod-backend-api-secret
    secretKey: db-password
  - envName: SPRING_FLYWAY_USER
    secretName: moment-prod-backend-api-secret
    secretKey: db-username
  - envName: SPRING_FLYWAY_PASSWORD
    secretName: moment-prod-backend-api-secret
    secretKey: db-password

  - envName: JWT_SECRET_KEY
    secretName: moment-prod-backend-api-secret
    secretKey: jwt-secret

  - envName: TOSS_SECRET_KEY
    secretName: moment-prod-backend-api-secret
    secretKey: toss-secret-key
  - envName: TOSS_CLIENT_KEY
    secretName: moment-prod-backend-api-secret
    secretKey: toss-client-key
  - envName: TOSS_SUCCESS_URL
    secretName: moment-prod-backend-api-secret
    secretKey: toss-success-url
  - envName: TOSS_FAIL_URL
    secretName: moment-prod-backend-api-secret
    secretKey: toss-fail-url
  - envName: KAKAO_CLIENT_SECRET
    secretName: moment-prod-backend-api-secret
    secretKey: kakao-client-secret
  - envName: KAKAO_CLIENT_ID
    secretName: moment-prod-backend-api-secret
    secretKey: kakao-client-id
  - envName: KAKAO_REDIRECT_URI
    secretName: moment-prod-backend-api-secret
    secretKey: kakao-redirect-uri
  - envName: PUBLIC_DATA_DATA_GO_KR_SERVICE_KEY
    secretName: moment-prod-backend-api-secret
    secretKey: public-data-data-go-kr-service-key

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

nodeSelector:
  workload: core
  capacity: on-demand

tolerations: []

affinity: {}

ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80,"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: ""
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
