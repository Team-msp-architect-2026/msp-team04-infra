namespace: moment-dev
replicaCount: 1
image:
  repository: 611058323802.dkr.ecr.ap-northeast-3.amazonaws.com/moment-dev-ai-service
  tag: dev-ed7a8d4
  pullPolicy: IfNotPresent
serviceAccount:
  create: true
  name: ai-service
  annotations:
    # IRSA Role ARN - EKS 올라올 때 실제 ARN으로 교체 필요
    eks.amazonaws.com/role-arn: ""
config:
  ENVIRONMENT: dev
  AWS_REGION: ap-northeast-3
  LOG_LEVEL: DEBUG
  # OpenSearch - EKS 올라올 때 실제 endpoint로 교체 필요
  OPENSEARCH_HOST: ""
  # Backend API internal endpoint - EKS 올라올 때 K8s service name으로 교체
  BACKEND_API_URL: "http://backend-api:8080"
secretRefs:
  - envName: OPENAI_API_KEY
    secretName: moment-dev-ai-secret
    secretKey: openai-api-key
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
nodeSelector:
  workload: ai
  capacity: spot
tolerations:
  - key: capacity
    operator: Equal
    value: spot
    effect: NoSchedule
affinity: {}
