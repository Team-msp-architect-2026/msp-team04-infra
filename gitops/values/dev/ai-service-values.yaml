namespace: moment-dev
replicaCount: 1
image:
  repository: 611058323802.dkr.ecr.ap-northeast-3.amazonaws.com/moment-dev-ai-service
  tag: dev-62e003b
  pullPolicy: IfNotPresent
serviceAccount:
  create: true
  name: moment-dev-ai-service-sa
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::611058323802:role/moment-dev-ai-service-irsa-role"
config:
  ENVIRONMENT: dev
  RUNTIME_PROFILE: dev
  SERVER_PORT: "8000"
  AWS_REGION: ap-northeast-3
  LOG_LEVEL: DEBUG
  OPENAI_MODEL: gpt-4o-mini
  OPENAI_EMBEDDING_MODEL: text-embedding-3-small
  OPENAI_TIMEOUT_SECONDS: "15"
  OPENSEARCH_HOST: vpc-moment-dev-opensearch-hdseoos3ibawg6xwwlaa4hff3u.ap-northeast-3.es.amazonaws.com
  BACKEND_API_URL: "http://backend-api:8080"
secretRefs:
  - envName: OPENAI_API_KEY
    secretName: moment-dev-ai-service-secret
    secretKey: openai-api-key
readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6
  successThreshold: 1
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 40
  periodSeconds: 15
  timeoutSeconds: 2
  failureThreshold: 5
  successThreshold: 1
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
# HA: RollingUpdate - dev replica 1, maxUnavailable 1 허용
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 1
# HA: PDB - dev replica 1이라 비활성
pdb:
  enabled: false
  minAvailable: 1
nodeSelector:
  workload: core
  capacity: on-demand
tolerations: []
affinity: {}
