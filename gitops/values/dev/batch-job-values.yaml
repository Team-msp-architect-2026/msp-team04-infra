namespace: moment-dev
image:
  repository: 611058323802.dkr.ecr.ap-northeast-3.amazonaws.com/moment-dev-batch-job
  tag: dev-24eabd0
  pullPolicy: IfNotPresent
serviceAccount:
  create: true
  name: batch-job
  annotations:
    # IRSA Role ARN - EKS 올라올 때 실제 ARN으로 교체 필요
    eks.amazonaws.com/role-arn: ""
schedule: "0 * * * *"
concurrencyPolicy: Forbid
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 1
backoffLimit: 3
restartPolicy: OnFailure
args:
  - "--spring.profiles.active=dev"
config:
  SPRING_PROFILES_ACTIVE: dev
  AWS_REGION: ap-northeast-3
  SQS_QUEUE_NAME: moment-dev-public-data-queue
  SQS_QUEUE_URL: https://sqs.ap-northeast-3.amazonaws.com/611058323802/moment-dev-public-data-queue
  S3_RAW_BUCKET: moment-dev-raw-data-611058323802-ap-northeast-3
  # RDS - EKS 올라올 때 실제 endpoint로 교체 필요
  DB_HOST: ""
  DB_PORT: "5432"
  DB_NAME: moment
secretRefs:
  - envName: DB_PASSWORD
    secretName: moment-dev-batch-secret
    secretKey: db-password
    # PUBLIC_DATA_API_KEY - 필요 시 추가
    # - envName: PUBLIC_DATA_API_KEY
    #   secretName: moment-dev-batch-secret
    #   secretKey: public-data-api-key
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
nodeSelector:
  workload: batch
  capacity: spot
tolerations:
  - key: capacity
    operator: Equal
    value: spot
    effect: NoSchedule
affinity: {}
