  SPRING_BATCH_JDBC_INITIALIZE_SCHEMA: "always"
  SPRING_BATCH_JOB_ENABLED: "false"
secretRefs:
  - envName: DB_USERNAME
    secretName: moment-dev-backend-api-secret
    secretKey: db-username
  - envName: DB_PASSWORD
    secretName: moment-dev-backend-api-secret
    secretKey: db-password
  - envName: JWT_SECRET_KEY
    secretName: moment-dev-backend-api-secret
    secretKey: jwt-secret
  - envName: TOSS_SECRET
    secretName: moment-dev-backend-api-secret
    secretKey: toss-secret
  - envName: SPRING_DATASOURCE_USERNAME
    secretName: moment-dev-backend-api-secret
    secretKey: db-username
  - envName: SPRING_DATASOURCE_PASSWORD
    secretName: moment-dev-backend-api-secret
    secretKey: db-password
  - envName: SPRING_FLYWAY_USER
    secretName: moment-dev-backend-api-secret
    secretKey: db-username
  - envName: SPRING_FLYWAY_PASSWORD
    secretName: moment-dev-backend-api-secret
    secretKey: db-password
readinessProbe:
  tcpSocket:
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 30
  successThreshold: 1
livenessProbe:
  tcpSocket:
    port: 8080
  initialDelaySeconds: 180
  periodSeconds: 15
  timeoutSeconds: 2
  failureThreshold: 5
  successThreshold: 1
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
nodeSelector:
  workload: core
  capacity: on-demand
tolerations: []
affinity: {}
ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/success-codes: "200,401"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
