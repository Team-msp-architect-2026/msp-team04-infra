namespace: moment-dev
replicaCount: 1
image:
  repository: 611058323802.dkr.ecr.ap-northeast-3.amazonaws.com/moment-dev-backend-api
  tag: dev-ed7a8d4
  pullPolicy: IfNotPresent
serviceAccount:
  create: true
  name: backend-api
  annotations:
    # IRSA Role ARN - EKS 올라올 때 실제 ARN으로 교체 필요
    # terraform output에서 backend API 전용 IRSA Role 생성 후 입력
    eks.amazonaws.com/role-arn: ""
config:
  SPRING_PROFILES_ACTIVE: dev
  AWS_REGION: ap-northeast-3
  ENVIRONMENT: dev
  DB_HOST: ""          # EKS 올라올 때 실제 RDS endpoint로 교체
  DB_PORT: "5432"
  DB_NAME: moment
  REDIS_HOST: ""       # EKS 올라올 때 실제 Redis endpoint로 교체
  REDIS_PORT: "6379"
  OPENSEARCH_HOST: "" # EKS 올라올 때 실제 endpoint로 교체
  S3_PROFILE_IMAGE_BUCKET: moment-dev-profile-image-611058323802-ap-northeast-3
  SQS_QUEUE_NAME: moment-dev-public-data-queue
  AI_SERVICE_URL: "http://ai-service:8000"
  # RDS - EKS 올라올 때 실제 endpoint로 교체 필요
  DB_HOST: ""
  DB_PORT: "5432"
  DB_NAME: moment
  # Redis - EKS 올라올 때 실제 endpoint로 교체 필요
  REDIS_HOST: ""
  REDIS_PORT: "6379"
  # OpenSearch - EKS 올라올 때 실제 endpoint로 교체 필요
  OPENSEARCH_HOST: ""
  # S3
  S3_PROFILE_IMAGE_BUCKET: moment-dev-profile-image-611058323802-ap-northeast-3
  # SQS
  SQS_QUEUE_NAME: moment-dev-public-data-queue
  # AI Service internal endpoint - EKS 올라올 때 K8s service name으로 교체
  AI_SERVICE_URL: "http://ai-service:8000"
secretRefs:
  - envName: DB_PASSWORD
    secretName: moment-dev-backend-secret
    secretKey: db-password
  - envName: JWT_SECRET
    secretName: moment-dev-backend-secret
    secretKey: jwt-secret
  - envName: TOSS_SECRET
    secretName: moment-dev-backend-secret
    secretKey: toss-secret
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
nodeSelector:
  workload: core
  capacity: on-demand
tolerations: []
affinity: {}
ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
