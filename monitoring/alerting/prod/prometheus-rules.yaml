apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: moment-application-alerts-prod
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: moment-application-alerts
    app.kubernetes.io/part-of: moment
    app.kubernetes.io/managed-by: argocd
    release: monitoring-prod
    environment: prod
spec:
  groups:
    - name: moment-prod-targets
      rules:
        - alert: MomentBackendTargetDown
          expr: |
            absent(up{namespace="moment-prod", service="backend-api"})
            or
            max by (namespace, service) (up{namespace="moment-prod", service="backend-api"}) == 0
          for: 2m
          labels:
            environment: prod
            severity: critical
            service: backend-api
            category: target
          annotations:
            summary: Backend API Prometheus target is down in Prod.
            description: Prometheus cannot scrape Backend API metrics from the Prod backend-api Service.
            action_hint: Check backend-api pods, Service labels, ServiceMonitor labels, and /actuator/prometheus endpoint.

        - alert: MomentAiServiceTargetDown
          expr: |
            absent(up{namespace="moment-prod", service="ai-service"})
            or
            max by (namespace, service) (up{namespace="moment-prod", service="ai-service"}) == 0
          for: 2m
          labels:
            environment: prod
            severity: critical
            service: ai-service
            category: target
          annotations:
            summary: AI Service Prometheus target is down in Prod.
            description: Prometheus cannot scrape AI Service metrics from the Prod ai-service Service.
            action_hint: Check ai-service pods, Service labels, ServiceMonitor labels, and /metrics endpoint.

    - name: moment-prod-workloads
      rules:
        - alert: MomentDeploymentUnavailable
          expr: |
            (
              kube_deployment_spec_replicas{namespace="moment-prod", deployment=~"backend-api|ai-service|batch-job"} > 0
            )
            and on (namespace, deployment)
            (
              kube_deployment_status_replicas_available{namespace="moment-prod", deployment=~"backend-api|ai-service|batch-job"}
              < kube_deployment_spec_replicas{namespace="moment-prod", deployment=~"backend-api|ai-service|batch-job"}
            )
          for: 5m
          labels:
            environment: prod
            severity: critical
            service: kubernetes
            category: workload
          annotations:
            summary: MoMent Prod Deployment has unavailable replicas.
            description: One or more MoMent Prod Deployments have fewer available replicas than desired replicas.
            action_hint: Check Deployment rollout, ReplicaSet, Pod events, image pull, secrets, node scheduling, and readiness probes.

        - alert: MomentPodRestartSpike
          expr: |
            sum by (namespace, pod, container) (
              increase(kube_pod_container_status_restarts_total{namespace="moment-prod", pod=~"(backend-api|ai-service|batch-job).*"}[15m])
            ) > 2
          for: 5m
          labels:
            environment: prod
            severity: warning
            service: kubernetes
            category: workload
          annotations:
            summary: MoMent Prod Pod restart spike detected.
            description: A MoMent Prod container restarted more than twice within 15 minutes.
            action_hint: Check pod logs, previous container logs, liveness probe, memory limits, and application startup errors.

        - alert: MomentPodCrashLoopBackOff
          expr: |
            max by (namespace, pod, container, reason) (
              kube_pod_container_status_waiting_reason{namespace="moment-prod", reason="CrashLoopBackOff", pod=~"(backend-api|ai-service|batch-job).*"}
            ) > 0
          for: 5m
          labels:
            environment: prod
            severity: critical
            service: kubernetes
            category: workload
          annotations:
            summary: MoMent Prod Pod is in CrashLoopBackOff.
            description: A MoMent Prod container is waiting with CrashLoopBackOff.
            action_hint: Check container logs, environment variables, ExternalSecret status, database connectivity, and application configuration.

    - name: moment-prod-backend-http
      rules:
        - alert: MomentBackendHigh5xxRate
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{namespace="moment-prod", service="backend-api", status=~"5..", uri!~"/health|/actuator.*"}[5m]))
              /
              clamp_min(sum(rate(http_server_requests_seconds_count{namespace="moment-prod", service="backend-api", uri!~"/health|/actuator.*"}[5m])), 1)
            ) > 0.05
            and
            sum(rate(http_server_requests_seconds_count{namespace="moment-prod", service="backend-api", uri!~"/health|/actuator.*"}[5m])) > 0.1
          for: 5m
          labels:
            environment: prod
            severity: warning
            service: backend-api
            category: http
          annotations:
            summary: Backend API 5xx rate is high in Prod.
            description: More than 5% of non-health Backend API requests returned 5xx during the last 5 minutes.
            action_hint: Check backend logs, recent deployments, database connectivity, Redis/OpenSearch connectivity, and failing endpoints.

        - alert: MomentBackendHighLatency
          expr: |
            (
              sum(rate(http_server_requests_seconds_sum{namespace="moment-prod", service="backend-api", uri!~"/health|/actuator.*"}[5m]))
              /
              clamp_min(sum(rate(http_server_requests_seconds_count{namespace="moment-prod", service="backend-api", uri!~"/health|/actuator.*"}[5m])), 1)
            ) > 1
            and
            sum(rate(http_server_requests_seconds_count{namespace="moment-prod", service="backend-api", uri!~"/health|/actuator.*"}[5m])) > 0.1
          for: 10m
          labels:
            environment: prod
            severity: warning
            service: backend-api
            category: latency
          annotations:
            summary: Backend API average latency is high in Prod.
            description: Average Backend API latency exceeded 1 second for non-health requests.
            action_hint: Check slow endpoints, database query time, OpenSearch latency, JVM heap, CPU, and external API calls.

    - name: moment-prod-business
      rules:
        - alert: MomentApplicationFailureSpike
          expr: sum(increase(moment_business_application_total{environment="dev", result="failed"}[10m])) > 5
          for: 2m
          labels:
            environment: prod
            severity: warning
            service: backend-api
            category: business
          annotations:
            summary: Application failure spike detected in Prod.
            description: Application API failures increased during the last 10 minutes.
            action_hint: Check application validation errors, child/program IDs, seat lock flow, and backend logs.

        - alert: MomentPaymentFailureSpike
          expr: sum(increase(moment_business_payment_total{environment="dev", result="failed"}[10m])) > 5
          for: 2m
          labels:
            environment: prod
            severity: warning
            service: backend-api
            category: business
          annotations:
            summary: Payment failure spike detected in Prod.
            description: Payment API failures increased during the last 10 minutes.
            action_hint: Check Toss configuration, payment state flow, application IDs, and backend logs.

        - alert: MomentSearchFailureSpike
          expr: sum(increase(moment_business_search_requests_total{environment="dev", result="failed"}[10m])) > 10
          for: 2m
          labels:
            environment: prod
            severity: warning
            service: backend-api
            category: business
          annotations:
            summary: Search failure spike detected in Prod.
            description: Search API failures increased during the last 10 minutes.
            action_hint: Check search request parameters, OpenSearch connectivity, AI rerank dependency, and backend logs.

        - alert: MomentRecommendationFailureSpike
          expr: sum(increase(moment_business_recommendation_requests_total{environment="dev", result="failed"}[10m])) > 5
          for: 2m
          labels:
            environment: prod
            severity: warning
            service: backend-api
            category: business
          annotations:
            summary: Recommendation failure spike detected in Prod.
            description: Recommendation API failures increased during the last 10 minutes.
            action_hint: Check child profile, preference data, recommendation rules, program data, and backend logs.
