apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: moment-prod-slack-alerts
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: moment-alertmanager-config
    app.kubernetes.io/part-of: moment
    app.kubernetes.io/managed-by: argocd
    environment: prod
spec:
  route:
    groupBy:
      - alertname
      - environment
      - service
      - severity
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    receiver: moment-prod-slack
    matchers:
      - name: environment
        value: prod
        matchType: =
  receivers:
    - name: moment-prod-slack
      slackConfigs:
        - apiURL:
            name: moment-prod-slack-alert-webhook
            key: url
          channel: "#moment-alerts"
          sendResolved: true
          title: '[{{ .Status | toUpper }}][prod][{{ .CommonLabels.severity }}] {{ .CommonLabels.alertname }}'
          text: |-
            {{ range .Alerts }}
            *Service:* {{ .Labels.service }}
            *Category:* {{ .Labels.category }}
            *Summary:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Action:* {{ .Annotations.action_hint }}
            {{ end }}
